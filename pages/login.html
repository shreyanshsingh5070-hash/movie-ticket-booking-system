<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login / Sign Up — ShowTime</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Show<span>Time</span></div>
    <div class="nav-links">
      <a href="index.html">Movies</a>
      <a href="#">Cinemas</a>
      <a href="#">Offers</a>
    </div>
    <div class="city-picker">Mathura, UP ▾</div>
  </nav>

  <!-- LOGIN FORM -->
  <div class="auth-page" id="login-view">
    <h2>Welcome back</h2>
    <p class="sub">Log in to book your tickets faster.</p>

    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-submit">Log In</button>
    </form>

    <p class="auth-switch">New here? <a href="#" onclick="showSignup(); return false;">Create an account</a></p>
  </div>

  <!-- SIGNUP FORM -->
  <div class="auth-page" id="signup-view" style="display:none;">
    <h2>Create account</h2>
    <p class="sub">Sign up to start booking tickets.</p>

    <form id="signup-form">
      <div class="form-group">
        <label for="signup-name">Full Name</label>
        <input type="text" id="signup-name" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label for="signup-confirm">Confirm Password</label>
        <input type="password" id="signup-confirm" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-submit">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="#" onclick="showLogin(); return false;">Log in</a></p>
  </div>

  <script src="js/script.js"></script>
  <script>
    function showSignup() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('signup-view').style.display = 'block';
    }
    function showLogin() {
      document.getElementById('signup-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'block';
    }
  </script>
</body>
</html>
