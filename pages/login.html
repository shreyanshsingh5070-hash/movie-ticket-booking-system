<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — ShowTime</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Show<span>Time</span></div>
    <div class="nav-links">
      <a href="index.html">Movies</a>
      <a href="#">Cinemas</a>
      <a href="#">Offers</a>
    </div>
    <div class="city-picker">Mathura, UP ▾</div>
  </nav>

  <div class="auth-page">
    <h2>Welcome back</h2>
    <p class="sub">Log in to book your tickets faster.</p>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-submit">Log In</button>
    </form>

    <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
