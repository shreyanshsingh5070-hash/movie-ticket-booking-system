<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MovieTickets</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container" style="margin-top: 2rem;">
        <div class="admin-container">
            <!-- Sidebar -->
            <aside class="admin-sidebar">
                <nav class="admin-nav">
                    <div class="admin-nav-item active" data-target="movies-section">Manage Movies</div>
                    <div class="admin-nav-item" data-target="shows-section">Manage Shows</div>
                    <div class="admin-nav-item" data-target="bookings-section">Bookings Overview</div>
                </nav>
            </aside>

            <!-- Main Content Area -->
            <div class="admin-content">
                
                <!-- Movies Section -->
                <section id="movies-section" class="admin-section active">
                    <div class="section-header">
                        <h2>Manage Movies</h2>
                        <button class="btn btn-primary" onclick="openMovieModal()">Add Movie</button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Genre</th>
                                    <th>Duration</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="movies-tbody">
                                <!-- Movies injected dynamically -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Shows Section -->
                <section id="shows-section" class="admin-section">
                    <div class="section-header">
                        <h2>Manage Shows</h2>
                        <button class="btn btn-primary" onclick="openShowModal()">Add Show</button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Movie</th>
                                    <th>Theatre</th>
                                    <th>Date/Time</th>
                                    <th>Price</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="shows-tbody">
                                <!-- Shows injected dynamically -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Bookings Section -->
                <section id="bookings-section" class="admin-section">
                    <div class="section-header">
                        <h2>Bookings Overview</h2>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Booking ID</th>
                                    <th>User</th>
                                    <th>Movie</th>
                                    <th>Show Date/Time</th>
                                    <th>Seats</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="bookings-tbody">
                                <!-- Bookings injected dynamically -->
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 MovieTickets. All rights reserved.</p>
        </div>
    </footer>

    <!-- Movie Modal -->
    <div id="movie-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="movie-modal-title">Add Movie</h3>
                <button class="close-btn" onclick="closeModal('movie-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="movie-form">
                    <input type="hidden" id="movie-id">
                    
                    <div style="margin-bottom: 1rem;">
                        <label style="display:block; margin-bottom: 0.5rem;">Title</label>
                        <input type="text" id="movie-title" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                    </div>
                    
                    <div style="margin-bottom: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem;">Genre</label>
                            <input type="text" id="movie-genre" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem;">Language</label>
                            <input type="text" id="movie-language" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                        </div>
                    </div>

                    <div style="margin-bottom: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem;">Duration</label>
                            <input type="text" id="movie-duration" placeholder="e.g. 120 mins" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem;">Rating</label>
                            <input type="text" id="movie-rating" placeholder="e.g. 8.5/10" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                        </div>
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label style="display:block; margin-bottom: 0.5rem;">Poster URL</label>
                        <input type="text" id="movie-poster" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label style="display:block; margin-bottom: 0.5rem;">Description</label>
                        <textarea id="movie-desc" rows="3" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;"></textarea>
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label style="display:block; margin-bottom: 0.5rem;">Cast (comma separated)</label>
                        <input type="text" id="movie-cast" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('movie-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveMovie()">Save Movie</button>
            </div>
        </div>
    </div>

    <!-- Show Modal -->
    <div id="show-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="show-modal-title">Add Show</h3>
                <button class="close-btn" onclick="closeModal('show-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="show-form">
                    <input type="hidden" id="show-id">
                    
                    <div style="margin-bottom: 1rem;">
                        <label style="display:block; margin-bottom: 0.5rem;">Movie</label>
                        <select id="show-movie" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                    
                    <div style="margin-bottom: 1rem;">
                        <label style="display:block; margin-bottom: 0.5rem;">Theatre</label>
                        <input type="text" id="show-theatre" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                    </div>

                    <div style="margin-bottom: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem;">Date (YYYY-MM-DD)</label>
                            <input type="date" id="show-date" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px; color-scheme: dark;">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem;">Time (HH:MM)</label>
                            <input type="time" id="show-time" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px; color-scheme: dark;">
                        </div>
                    </div>

                    <div style="margin-bottom: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem;">Screen Type</label>
                            <input type="text" id="show-screen" placeholder="e.g. IMAX" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem;">Price ($)</label>
                            <input type="number" step="0.01" id="show-price" required style="width: 100%; padding: 0.5rem; background: var(--background-color); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('show-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveShow()">Save Show</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
