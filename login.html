<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MovieTickets</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 0 auto;
            margin-top: var(--spacing-8);
        }
        .form-group {
            margin-bottom: var(--spacing-4);
        }
        .form-label {
            display: block;
            margin-bottom: var(--spacing-2);
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: var(--spacing-2) var(--spacing-3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: var(--background-color);
            color: var(--text-primary);
            border-radius: var(--border-radius-md);
            font-family: inherit;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .error-message {
            color: var(--error-color);
            font-size: var(--text-xs);
            margin-top: var(--spacing-1);
            display: none;
        }
        .text-center {
            text-align: center;
        }
        .mt-4 {
            margin-top: var(--spacing-4);
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container">
        <div class="auth-container card">
            <div class="card-body">
                <h2 class="text-center">Welcome Back</h2>
                <p class="text-center">Login to book your tickets</p>
                
                <form id="login-form">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter your username">
                        <div id="username-error" class="error-message"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password">
                        <div id="password-error" class="error-message"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                    
                    <p class="text-center mt-4">
                        Don't have an account? <a href="signup.html" style="color: var(--primary-color);">Sign up</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 MovieTickets. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('navbar-container');
        });
    </script>
</body>
</html>
