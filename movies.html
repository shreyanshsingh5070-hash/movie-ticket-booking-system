<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Movies - MovieTickets</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/movies.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container">
        <div class="movies-header">
            <h1>All Movies</h1>
            <p>Find and book tickets for your favorite movies.</p>
        </div>

        <div class="filters-bar">
            <input type="text" id="search-input" class="search-input" placeholder="Search movies by title...">
            
            <select id="genre-filter" class="filter-select">
                <option value="">All Genres</option>
                <!-- Options populated dynamically -->
            </select>
            
            <select id="language-filter" class="filter-select">
                <option value="">All Languages</option>
                <!-- Options populated dynamically -->
            </select>
        </div>

        <div id="movies-grid" class="grid grid-cols-4">
            <!-- Movie cards injected dynamically -->
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 MovieTickets. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/movies.js"></script>
</body>
</html>
